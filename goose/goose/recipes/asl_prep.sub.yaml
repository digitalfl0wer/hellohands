title: "ASL Prep (MS-ASL)"
vars:
  subset: { type: string, default: "100" }
  fps:    { type: string, default: "30" }
  size:   { type: string, default: "256" }
activities:
  - name: Filter
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/msasl_filter.ts --subset {{ vars.subset }}" } }
  - name: Download
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/msasl_download.ts --subset {{ vars.subset }}" } }
  - name: Trim
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/msasl_trim.ts --subset {{ vars.subset }} --fps {{ vars.fps }} --size {{ vars.size }}" } }
  - name: Emit labels
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/msasl_emit_labels.ts --subset {{ vars.subset }}" } }
