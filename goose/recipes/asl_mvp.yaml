title: "ASL MVP Orchestrator"
vars:
  subset: { type: string, default: "100" }
  fps:    { type: string, default: "30" }
  size:   { type: string, default: "256" }
  phases: { type: string, default: "prep,practice,train,eval" }
activities:
  - name: Prep
    when: "{{ 'prep' in vars.phases }}"
    run: { subrecipe: "./asl_prep.sub.yaml", with: { subset: "{{ vars.subset }}", fps: "{{ vars.fps }}", size: "{{ vars.size }}" } }
  - name: Practice
    when: "{{ 'practice' in vars.phases }}"
    run: { subrecipe: "./asl_practice.sub.yaml", with: { subset: "{{ vars.subset }}" } }
  - name: Train
    when: "{{ 'train' in vars.phases }}"
    run: { subrecipe: "./asl_train.sub.yaml", with: { subset: "{{ vars.subset }}" } }
  - name: Eval
    when: "{{ 'eval' in vars.phases }}"
    run: { subrecipe: "./asl_eval.sub.yaml", with: { subset: "{{ vars.subset }}" } }
