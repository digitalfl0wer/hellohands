title: "ASL Practice (one-handed)"
vars:
  subset: { type: string, default: "100" }
activities:
  - name: Validate whitelist
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/practice_validate_whitelist.ts --subset {{ vars.subset }}" } }
  - name: Generate packs
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/practice_generate_packs.ts --subset {{ vars.subset }}" } }
  - name: Coverage
    run: { mcp: shell, with: { command: "pnpm ts-node scripts/practice_coverage.ts --subset {{ vars.subset }}" } }
